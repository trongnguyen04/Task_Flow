{% extends "layout.html" %}

{% block title %}Đặt lại mật khẩu - Task Flow{% endblock %}

{% block content %}
<section class="auth-panel">
    <form method="post" class="form-card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="login-brand">
            <span class="brand-icon large">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                    <circle cx="6" cy="8" r="2" fill="white"/>
                    <line x1="11" y1="8" x2="19" y2="8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="6" cy="16" r="2" fill="white"/>
                    <line x1="11" y1="16" x2="19" y2="16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </span>
            <h1>Task Flow</h1>
            <p>Tạo mật khẩu mới</p>
        </div>

        <div>
            <h1>Đặt lại mật khẩu</h1>
            <p class="hint">Mật khẩu mới cần có chữ hoa, số và ký tự đặc biệt.</p>
        </div>

        <div>
            <label for="new_password">Mật khẩu mới <span class="required">*</span></label>
            <div class="input-icon">
                <span class="icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </span>
                <input id="new_password" name="new_password" type="password" placeholder="Vd: Abc123@" required autofocus autocomplete="new-password">
            </div>
        </div>

        <div>
            <label for="confirm_password">Xác nhận mật khẩu mới <span class="required">*</span></label>
            <div class="input-icon">
                <span class="icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </span>
                <input id="confirm_password" name="confirm_password" type="password" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
            </div>
        </div>

        <button class="button primary" type="submit" style="width:100%;min-height:44px;font-size:15px;">Lưu mật khẩu mới</button>
        <a class="forgot-link" href="{{ url_for('auth.login') }}">Quay lại đăng nhập</a>
    </form>
</section>
{% endblock %}
